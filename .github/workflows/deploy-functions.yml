name: Deploy Supabase Edge Functions

# Edge functions deploy separately from the GitHub Pages site (that workflow only
# builds the front-end). This deploys the functions in supabase/functions/ to the
# Supabase project whenever they change on master.
#
# Requires two repository secrets:
#   SUPABASE_ACCESS_TOKEN  — a personal access token from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — the project ref (lsmqhowvmqwgztpnshbc)

on:
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF secrets are not set — skipping."
            exit 0
          fi
          # verify_jwt per function is read from supabase/config.toml
          supabase functions deploy --project-ref "$PROJECT_REF"
