name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after ~7 days of inactivity. While paused
# the app cannot reach the database or storage, so it falls back to sample data and
# uploads fail — which looks like data loss. A lightweight scheduled request keeps
# the project active so this cannot silently recur.

on:
  schedule:
    - cron: '17 6 */2 * *' # every 2 days, well inside the ~7-day pause window
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets are not configured — skipping keep-alive."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/documents?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Unexpected status — the project may be paused or misconfigured."
            exit 1
          fi
